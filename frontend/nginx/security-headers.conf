# Security headers, included per location.
#
# nginx replaces inherited add_header directives as soon as a location declares
# one of its own, so any location that sets Cache-Control must include this
# file too or it would silently serve responses with no security headers.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# The bundle loads nothing from anywhere else: no CDN, no remote fonts, no
# third party analytics. connect-src 'self' is enough because the API is
# proxied under the same origin by this server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
