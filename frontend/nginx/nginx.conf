# nginx configuration for serving the built SPA and proxying the API.
#
# Everything is arranged to run as an unprivileged user: the listen port is
# above 1024 and every path nginx writes to lives under /tmp.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Do not advertise the exact nginx version to anyone probing the service.
    server_tokens off;

    # Writable paths for a non-root worker.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # The SPA posts small JSON bodies; anything larger is not ours.
        client_max_body_size 256k;

        # Serving the API from the same origin means the browser never makes a
        # cross-origin request, so CORS never enters the picture in production
        # and the content security policy can stay at 'self'.
        location /api/v1/ {
            include /etc/nginx/conf.d/security-headers.conf;

            proxy_pass http://backend:8080/api/v1/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Slightly longer than the backend's own write timeout, so the
            # application's error surfaces rather than a gateway timeout.
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Fingerprinted assets can be cached forever: a new build changes the
        # file name, so a stale entry can never be served.
        location /assets/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The entry document must never be cached, or a browser keeps pointing
        # at asset names that no longer exist after a deploy.
        location = /index.html {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Client-side routing: unknown paths fall back to the app shell.
        location / {
            include /etc/nginx/conf.d/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
